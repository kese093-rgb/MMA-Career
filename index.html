<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Твоя карьера промоушна</title>
<script>
window.onerror = function(msg, url, line, col) {
  var d = document.createElement('div');
  d.style.cssText = 'position:fixed;inset:0;background:#000;color:#ff4444;padding:20px;font-size:14px;z-index:99999;overflow:auto;white-space:pre-wrap;';
  d.textContent = 'ОШИБКА:\n' + msg + '\n\nФайл: ' + url + '\nСтрока: ' + line + ':' + col;
  document.body.appendChild(d);
};
</script>
<style>
* { box-sizing: border-box; }
body { margin: 0; background: #050505; color: white; font-family: Arial, sans-serif; }

.screen {
  display: none;
  min-height: 100vh;
  padding: 20px;
  background: linear-gradient(rgba(0,0,0,.55),rgba(0,0,0,.75)), url("pngtree-vertical-geometric-trendy-composition-of-silver-lines-on-black-neutral-background-image_605703.jpg") center/cover no-repeat fixed;
}
.screen.active { display: block; }

#loadingScreen { position: fixed; inset: 0; padding: 0; background: #000; display: none; align-items: center; justify-content: center; z-index: 10000; }
#loadingScreen.active { display: flex; }
#loadingImg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
#loadingContinue { position: absolute; bottom: 80px; left: 50%; transform: translateX(-50%); padding: 14px 32px; background: rgba(200,0,0,0.9); color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: 900; z-index: 10; display: none; cursor: pointer; }
#loadingContinue.visible { display: block; }

#introScreen { position: fixed; inset: 0; padding: 0; background: #000; display: none; align-items: center; justify-content: center; z-index: 9999; }
#introScreen.active { display: flex; }
#introVideo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; background: #000; }
#introSkip { position: absolute; bottom: 120px; left: 50%; transform: translateX(-50%); padding: 14px 32px; background: rgba(200,0,0,0.9); color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: 900; z-index: 10; display: none; cursor: pointer; }
#introSkip.visible { display: block; }

.main-title { padding-top: 70px; font-size: 40px; font-weight: 900; line-height: 1; text-align: center; }
.main-title span { color: red; }
.menu-buttons { margin-top: 50px; }
.menu-card { position: relative; width: 90%; max-width: 400px; height: 180px; margin: 18px auto; border-radius: 12px; overflow: hidden; cursor: pointer; border: 2px solid #333; }
.menu-card img { width: 100%; height: 100%; object-fit: cover; }
.menu-card::after { content: ""; position: absolute; inset: 0; background: linear-gradient(transparent,rgba(0,0,0,.85)); }
.menu-card-title { position: absolute; bottom: 14px; left: 16px; z-index: 2; font-size: 20px; font-weight: 900; }

/* Create promotion */
h1 { text-align: center; margin-top: 10px; font-size: 26px; }
.form-box { max-width: 500px; margin: 20px auto; }
label { display: block; margin-top: 14px; margin-bottom: 6px; font-weight: bold; font-size: 14px; color: #ccc; }
input, select { width: 100%; padding: 13px; background: #151515; color: white; border: 1px solid #333; border-radius: 8px; font-size: 16px; }
.red-button { width: 100%; margin-top: 20px; padding: 16px; background: red; color: white; border: none; border-radius: 9px; font-size: 17px; font-weight: 900; }
.back-button { width: 100%; margin-top: 12px; padding: 14px; background: #222; color: white; border: 1px solid #444; border-radius: 8px; font-size: 15px; font-weight: 900; }
.section-title { color: gold; font-weight: 900; font-size: 16px; margin-top: 24px; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { background: #171717; color: white; border: 1px solid #333; padding: 9px 13px; border-radius: 8px; font-weight: 900; font-size: 13px; cursor: pointer; }
.chip.active { background: red; border-color: red; }
.color-row { display: flex; gap: 10px; flex-wrap: wrap; }
.color-dot { width: 40px; height: 40px; border-radius: 50%; cursor: pointer; border: 3px solid transparent; }
.color-dot.active { border-color: white; }

/* Logo preview */
.logo-preview-wrap { display: flex; justify-content: center; margin: 20px 0; }
.logo-preview {
  width: 180px;
  height: 180px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 900;
  font-size: 46px;
  letter-spacing: 2px;
  background: #000;
  color: gold;
  box-shadow: 0 10px 30px rgba(0,0,0,.7);
}
</style>
</head>
<body>

<section id="loadingScreen" class="screen active">
    <img id="loadingImg" src="IMG_20261015_131935_584.jpg" alt="Загрузка">
    <button id="loadingContinue" onclick="startIntroWithSound()">ПРОДОЛЖИТЬ</button>
</section>

<section id="introScreen" class="screen">
    <video id="introVideo" src="VID_20261015_124945_834.mp4" playsinline preload="auto"></video>
    <button id="introSkip" onclick="skipIntro()">ПРОПУСТИТЬ</button>
</section>

<section id="mainMenu" class="screen">
    <div class="main-title">ТВОЯ КАРЬЕРА<br><span>ПРОМОУШНА</span></div>
    <div class="menu-buttons">
        <div class="menu-card" onclick="continueLastGame()">
            <img src="IMG_ef241dcf-ce29-46a5-98ef-9f6481b4704c.jpg" alt="Продолжить">
            <div class="menu-card-title">ПРОДОЛЖИТЬ ПОСЛЕДНЮЮ ИГРУ</div>
        </div>
        <div class="menu-card" onclick="openCreatePromotion()">
            <img src="izuchaem-glavnye-mma-promousheny-planety_17306224402071660880.jpg" alt="Создать промоушн">
            <div class="menu-card-title">СОЗДАТЬ ПРОМОУШН</div>
        </div>
    </div>
</section>

<section id="createPromotion" class="screen">
    <h1>ПРОФИЛЬ ПРОМОУШНА</h1>
    <div class="form-box">
        <label>Название</label>
        <input id="promoName" type="text" placeholder="Например: Prime League">

        <label>Короткое название (макс. 3 буквы)</label>
        <input id="promoShortName" type="text" maxlength="3" placeholder="PLY">

        <label>Родная страна</label>
        <select id="promoCountry">
            <option value="США">США</option>
            <option value="Россия">Россия</option>
            <option value="Бразилия">Бразилия</option>
            <option value="Великобритания">Великобритания</option>
            <option value="Канада">Канада</option>
            <option value="Австралия">Австралия</option>
            <option value="Китай">Китай</option>
            <option value="Япония">Япония</option>
            <option value="Южная Корея">Южная Корея</option>
            <option value="Германия">Германия</option>
            <option value="Франция">Франция</option>
            <option value="Испания">Испания</option>
            <option value="Италия">Италия</option>
            <option value="Мексика">Мексика</option>
            <option value="Аргентина">Аргентина</option>
            <option value="ОАЭ">ОАЭ</option>
            <option value="Индия">Индия</option>
            <option value="Казахстан">Казахстан</option>
            <option value="Украина">Украина</option>
            <option value="Нидерланды">Нидерланды</option>
        </select>

        <div class="section-title">Логотип промоушна</div>

        <div class="logo-preview-wrap">
            <div id="logoPreview" class="logo-preview">PLY</div>
        </div>

        <label>Форма</label>
        <div class="chips" id="shapeChips">
            <button type="button" class="chip" data-val="rectangle">Прямоугольник</button>
            <button type="button" class="chip" data-val="rounded">Скруглённый</button>
            <button type="button" class="chip" data-val="octagon">Восьмиугольник</button>
            <button type="button" class="chip active" data-val="circle">Круг</button>
        </div>

        <label>Шрифт</label>
        <div class="chips" id="fontChips">
            <button type="button" class="chip active" data-val="bold">Bold</button>
            <button type="button" class="chip" data-val="condensed">Condensed</button>
            <button type="button" class="chip" data-val="italic">Italic</button>
            <button type="button" class="chip" data-val="wide">Wide</button>
            <button type="button" class="chip" data-val="serif">Serif</button>
        </div>

        <label>Рамка</label>
        <div class="chips" id="borderChips">
            <button type="button" class="chip active" data-val="none">Нет</button>
            <button type="button" class="chip" data-val="thin">Тонкая</button>
            <button type="button" class="chip" data-val="thick">Толстая</button>
            <button type="button" class="chip" data-val="double">Двойная</button>
        </div>

        <label>Основной цвет (буквы и рамка)</label>
        <div class="color-row" id="primaryColors">
            <div class="color-dot active" data-val="#c9a14a" style="background:#c9a14a;"></div>
            <div class="color-dot" data-val="#c0c0c0" style="background:#c0c0c0;"></div>
            <div class="color-dot" data-val="#4a78c9" style="background:#4a78c9;"></div>
            <div class="color-dot" data-val="#2f8f4e" style="background:#2f8f4e;"></div>
            <div class="color-dot" data-val="#c26a2a" style="background:#c26a2a;"></div>
            <div class="color-dot" data-val="#c23a3a" style="background:#c23a3a;"></div>
        </div>

        <label>Дополнительный цвет (фон)</label>
        <div class="color-row" id="secondaryColors">
            <div class="color-dot" data-val="#2f8f4e" style="background:#2f8f4e;"></div>
            <div class="color-dot" data-val="#c26a2a" style="background:#c26a2a;"></div>
            <div class="color-dot" data-val="#a52a2a" style="background:#a52a2a;"></div>
            <div class="color-dot" data-val="#7a4aad" style="background:#7a4aad;"></div>
            <div class="color-dot" data-val="#1c2a3a" style="background:#1c2a3a;"></div>
            <div class="color-dot active" data-val="#000000" style="background:#000000;"></div>
        </div>

        <button class="red-button" onclick="startPromotion()">СТАРТ</button>
        <button class="back-button" onclick="showScreen('mainMenu')">Назад</button>
    </div>
</section>

<script>
let loadingTimers = [];

const loadingFrames = [
    { delay: 0,    src: "IMG_20261015_131935_584.jpg" },
    { delay: 2000, src: "IMG_20261015_132354_203.jpg" },
    { delay: 4000, src: "IMG_20261015_132531_811.jpg" },
    { delay: 6000, src: "IMG_20261015_132752_440.jpg" }
];

const logoState = {
    shape: "circle",
    font: "bold",
    border: "none",
    primary: "#c9a14a",
    secondary: "#000000"
};

const fontMap = {
    bold: { fontWeight: 900, fontStyle: "normal", fontFamily: "Arial, sans-serif", letterSpacing: "2px", transform: "none" },
    condensed: { fontWeight: 900, fontStyle: "normal", fontFamily: "Arial Narrow, Arial, sans-serif", letterSpacing: "1px", transform: "scaleX(0.8)" },
    italic: { fontWeight: 900, fontStyle: "italic", fontFamily: "Arial, sans-serif", letterSpacing: "2px", transform: "none" },
    wide: { fontWeight: 900, fontStyle: "normal", fontFamily: "Arial, sans-serif", letterSpacing: "8px", transform: "none" },
    serif: { fontWeight: 900, fontStyle: "normal", fontFamily: "Georgia, serif", letterSpacing: "2px", transform: "none" }
};

function showScreen(id) {
    document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
    const target = document.getElementById(id);
    if (target) target.classList.add("active");
}

function startLoadingSequence() {
    const img = document.getElementById("loadingImg");
    const btn = document.getElementById("loadingContinue");
    btn.classList.remove("visible");
    loadingTimers.forEach(t => clearTimeout(t));
    loadingTimers = [];

    loadingFrames.forEach((frame, i) => {
        if (i === 0) {
            img.src = frame.src;
            return;
        }
        const t = setTimeout(() => { img.src = frame.src; }, frame.delay);
        loadingTimers.push(t);
    });
    const tEnd = setTimeout(() => { btn.classList.add("visible"); }, 6000);
    loadingTimers.push(tEnd);
}

function startIntroWithSound() {
    const btn = document.getElementById("loadingContinue");
    btn.classList.remove("visible");
    showScreen("introScreen");

    const video = document.getElementById("introVideo");
    const skip = document.getElementById("introSkip");
    skip.classList.remove("visible");
    video.currentTime = 0;
    video.volume = 1.0;
    video.muted = false;

    const skipTimer = setTimeout(() => { skip.classList.add("visible"); }, 4000);

    video.onended = () => {
        clearTimeout(skipTimer);
        endIntro();
    };

    const playPromise = video.play();
    if (playPromise && playPromise.catch) {
        playPromise.catch((e) => {
            console.error("Video play failed:", e);
            clearTimeout(skipTimer);
            endIntro();
        });
    }
}

function skipIntro() {
    const video = document.getElementById("introVideo");
    try { video.pause(); } catch (e) {}
    endIntro();
}

function endIntro() {
    showScreen("mainMenu");
}

function continueLastGame() {
    alert("Раздел в разработке");
}

function openCreatePromotion() {
    showScreen("createPromotion");
    updateLogoPreview();
}

function getShortName() {
    const inp = document.getElementById("promoShortName");
    const v = (inp.value || "PLY").toUpperCase().slice(0, 3);
    return v || "PLY";
}

function updateLogoPreview() {
    const el = document.getElementById("logoPreview");
    const shortName = getShortName();
    el.textContent = shortName;

    const fontCfg = fontMap[logoState.font] || fontMap.bold;
    el.style.fontWeight = fontCfg.fontWeight;
    el.style.fontStyle = fontCfg.fontStyle;
    el.style.fontFamily = fontCfg.fontFamily;
    el.style.letterSpacing = fontCfg.letterSpacing;
    el.style.transform = fontCfg.transform;

    el.style.color = logoState.primary;
    el.style.background = logoState.secondary;

    let borderRadius = "0";
    let clipPath = "none";
    if (logoState.shape === "circle") borderRadius = "50%";
    else if (logoState.shape === "rounded") borderRadius = "24px";
    else if (logoState.shape === "octagon") { borderRadius = "0"; clipPath = "polygon(30% 0%, 70% 0%, 100% 30%, 100% 70%, 70% 100%, 30% 100%, 0% 70%, 0% 30%)"; }
    else if (logoState.shape === "rectangle") borderRadius = "0";

    el.style.borderRadius = borderRadius;
    el.style.clipPath = clipPath;

    let borderWidth = "0";
    let borderStyle = "solid";
    if (logoState.border === "thin") borderWidth = "2px";
    else if (logoState.border === "thick") borderWidth = "6px";
    else if (logoState.border === "double") { borderWidth = "6px"; borderStyle = "double"; }

    el.style.border = borderWidth === "0" ? "none" : `${borderWidth} ${borderStyle} ${logoState.primary}`;
}

function bindChips(containerId, key) {
    const container = document.getElementById(containerId);
    if (!container) return;
    container.querySelectorAll(".chip").forEach(btn => {
        btn.addEventListener("click", () => {
            container.querySelectorAll(".chip").forEach(b => b.classList.remove("active"));
            btn.classList.add("active");
            logoState[key] = btn.dataset.val;
            updateLogoPreview();
        });
    });
}

function bindColors(containerId, key) {
    const container = document.getElementById(containerId);
    if (!container) return;
    container.querySelectorAll(".color-dot").forEach(dot => {
        dot.addEventListener("click", () => {
            container.querySelectorAll(".color-dot").forEach(d => d.classList.remove("active"));
            dot.classList.add("active");
            logoState[key] = dot.dataset.val;
            updateLogoPreview();
        });
    });
}

function startPromotion() {
    const name = document.getElementById("promoName").value.trim();
    const shortName = getShortName();
    const country = document.getElementById("promoCountry").value;
    if (!name) { alert("Введите название промоушна"); return; }
    if (!shortName) { alert("Введите короткое название"); return; }
    const data = {
        name,
        shortName,
        country,
        logo: { ...logoState }
    };
    localStorage.setItem("promotionProfile", JSON.stringify(data));
    alert("Промоушн создан: " + name + " (" + shortName + ")\n\nРаздел в разработке");
}

document.addEventListener("DOMContentLoaded", () => {
    startLoadingSequence();

    bindChips("shapeChips", "shape");
    bindChips("fontChips", "font");
    bindChips("borderChips", "border");
    bindColors("primaryColors", "primary");
    bindColors("secondaryColors", "secondary");

    const shortInput = document.getElementById("promoShortName");
    shortInput.addEventListener("input", () => {
        shortInput.value = shortInput.value.toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 3);
        updateLogoPreview();
    });
});
</script>

</body>
              </html>
