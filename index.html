<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Твоя карьера — ММА</title>

<style>
    * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    body {
        margin: 0;
        min-height: 100vh;
        background: #050505;
        color: white;
        font-family: Arial, sans-serif;
    }

    button,
    input,
    select {
        font-family: inherit;
    }

    .screen {
        min-height: 100vh;
        width: 100%;
        display: none;
        padding: 30px 20px;
    }

    .screen.active {
        display: flex;
        flex-direction: column;
    }

    /* =========================
       ГЛАВНОЕ МЕНЮ
    ========================= */

    #mainMenu {
        align-items: center;
        justify-content: center;
    }

    .game-title {
        text-align: center;
        margin-bottom: 55px;
    }

    .game-title h1 {
        margin: 0;
        font-size: 32px;
        font-weight: 900;
        letter-spacing: 3px;
        color: white;
    }

    .game-title h2 {
        margin: 5px 0 0;
        font-size: 42px;
        font-weight: 900;
        letter-spacing: 6px;
        color: #e00000;
    }

    .menu-buttons {
        width: 100%;
        max-width: 430px;
        display: flex;
        flex-direction: column;
        gap: 14px;
    }

    .menu-button {
        width: 100%;
        min-height: 64px;
        border: none;
        border-radius: 8px;
        background: #d90000;
        color: white;
        font-size: 18px;
        font-weight: 700;
        text-align: left;
        padding: 0 22px;
        cursor: pointer;
        transition: 0.15s;
    }

    .menu-button:active:not(:disabled) {
        transform: scale(0.98);
        background: #a90000;
    }

    .menu-button:disabled {
        background: #171717;
        color: #555;
        cursor: not-allowed;
    }

    .menu-button.development {
        background: #171717;
        color: #666;
        cursor: not-allowed;
    }

    .dev-text {
        display: block;
        margin-top: 4px;
        font-size: 10px;
        color: #555;
        letter-spacing: 1px;
    }

    /* =========================
       ЗАГОЛОВОК ЭКРАНА
    ========================= */

    .screen-header {
        text-align: center;
        margin-bottom: 28px;
    }

    .screen-header h1 {
        margin: 0;
        font-size: 27px;
        text-transform: uppercase;
        letter-spacing: 2px;
    }

    .screen-header span {
        color: #e00000;
    }

    /* =========================
       СОЗДАНИЕ БОЙЦА
    ========================= */

    .fighter-form {
        width: 100%;
        max-width: 500px;
        margin: 0 auto;
    }

    .field {
        margin-bottom: 18px;
    }

    .field label {
        display: block;
        margin-bottom: 7px;
        color: #bbb;
        font-size: 13px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.7px;
    }

    .field input,
    .field select {
        width: 100%;
        height: 52px;
        padding: 0 15px;
        border: 1px solid #333;
        border-radius: 7px;
        background: #111;
        color: white;
        outline: none;
        font-size: 16px;
    }

    .field input:focus,
    .field select:focus {
        border-color: #d90000;
    }

    .field select option {
        background: #111;
        color: white;
    }

    .appearance-box {
        width: 100%;
        min-height: 70px;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 1px dashed #3b3b3b;
        border-radius: 7px;
        background: #0d0d0d;
        color: #666;
        text-align: center;
        font-size: 14px;
    }

    .form-buttons {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-top: 25px;
    }

    .primary-button,
    .secondary-button {
        width: 100%;
        min-height: 55px;
        border: none;
        border-radius: 7px;
        font-size: 17px;
        font-weight: 700;
        cursor: pointer;
    }

    .primary-button {
        background: #d90000;
        color: white;
    }

    .primary-button:disabled {
        background: #292929;
        color: #666;
        cursor: not-allowed;
    }

    .secondary-button {
        background: #171717;
        color: #aaa;
    }

    /* =========================
       МЕНЮ КАРЬЕРЫ
    ========================= */

    #careerMenu {
        align-items: center;
    }

    .career-card {
        width: 100%;
        max-width: 500px;
        background: #101010;
        border: 1px solid #252525;
        border-radius: 10px;
        padding: 22px;
        margin-bottom: 20px;
    }

    .fighter-name {
        font-size: 26px;
        font-weight: 900;
        margin-bottom: 7px;
    }

    .fighter-info {
        color: #999;
        font-size: 14px;
        line-height: 1.6;
    }

    .career-buttons {
        width: 100%;
        max-width: 500px;
        display: flex;
        flex-direction: column;
        gap: 12px;
    }

    .career-button {
        min-height: 58px;
        width: 100%;
        border: none;
        border-radius: 7px;
        background: #d90000;
        color: white;
        font-size: 17px;
        font-weight: 700;
        text-align: left;
        padding: 0 20px;
        cursor: pointer;
    }

    .career-button.disabled {
        background: #171717;
        color: #555;
        cursor: not-allowed;
    }

    .back-button {
        margin-top: 20px;
        background: transparent;
        border: none;
        color: #777;
        font-size: 15px;
        cursor: pointer;
    }

    @media (max-width: 380px) {
        .game-title h1 {
            font-size: 27px;
        }

        .game-title h2 {
            font-size: 35px;
        }

        .screen {
            padding: 25px 15px;
        }
    }
</style>
</head>

<body>

<!-- =========================
     ГЛАВНОЕ МЕНЮ
========================= -->

<section id="mainMenu" class="screen active">

    <div class="game-title">
        <h1>ТВОЯ КАРЬЕРА</h1>
        <h2>ММА</h2>
    </div>

    <div class="menu-buttons">

        <button
            id="continueButton"
            class="menu-button"
            onclick="continueGame()"
            disabled>
            ▶ &nbsp; Продолжить игру
        </button>

        <button
            class="menu-button"
            onclick="showScreen('createFighter')">
            🆕 &nbsp; Новая игра
        </button>

        <button
            class="menu-button development"
            disabled>
            ⚒️ &nbsp; Настройки
            <span class="dev-text">В РАЗРАБОТКЕ</span>
        </button>

    </div>

</section>


<!-- =========================
     СОЗДАНИЕ БОЙЦА
========================= -->

<section id="createFighter" class="screen">

    <div class="screen-header">
        <h1>Создание <span>бойца</span></h1>
    </div>

    <form id="fighterForm" class="fighter-form">

        <div class="field">
            <label for="fighterName">Имя Фамилия</label>
            <input
                id="fighterName"
                type="text"
                maxlength="40"
                placeholder="Например: Артур Иванов"
                required>
        </div>

        <div class="field">
            <label for="fighterAge">Возраст</label>
            <select id="fighterAge" required>
                <option value="">Выберите возраст</option>
                <option value="22">22 года</option>
                <option value="23">23 года</option>
                <option value="24">24 года</option>
                <option value="25">25 лет</option>
            </select>
        </div>

        <div class="field">
            <label for="fighterCountry">Страна</label>
            <select id="fighterCountry" required>
                <option value="">Выберите страну</option>
                <option>Россия</option>
                <option>Украина</option>
                <option>Бразилия</option>
                <option>Испания</option>
                <option>Грузия</option>
                <option>Армения</option>
                <option>США</option>
                <option>Англия</option>
                <option>Казахстан</option>
                <option>Азербайджан</option>
            </select>
        </div>

        <div class="field">
            <label for="fighterStyle">Стиль</label>
            <select id="fighterStyle" required>
                <option value="">Выберите стиль</option>
                <option>Бокс</option>
                <option>Кикбоксинг</option>
                <option>Тайский бокс</option>
                <option>Вольная борьба</option>
                <option>БЖЖ</option>
            </select>
        </div>

        <div class="field">
            <label for="fighterWeight">Весовая категория</label>
            <select id="fighterWeight" required>
                <option value="">Выберите категорию</option>
                <option value="light">Лёгкий — до 70,3 кг</option>
                <option value="welter">Полусредний — до 77,1 кг</option>
                <option value="middle">Средний — до 83,9 кг</option>
                <option value="lightheavy">Полутяжёлый — до 90,0 кг</option>
                <option value="heavy">Тяжёлый — до 120,2 кг</option>
            </select>
        </div>

        <div class="field">
            <label>Внешность</label>
            <div class="appearance-box">
                ‼️ В РАЗРАБОТКЕ ‼️
            </div>
        </div>

        <div class="form-buttons">

            <button
                id="startCareerButton"
                type="submit"
                class="primary-button">
                Начать карьеру
            </button>

            <button
                type="button"
                class="secondary-button"
                onclick="showScreen('mainMenu')">
                Назад
            </button>

        </div>

    </form>

</section>


<!-- =========================
     МЕНЮ КАРЬЕРЫ
========================= -->

<section id="careerMenu" class="screen">

    <div class="screen-header">
        <h1>Моя <span>карьера</span></h1>
    </div>

    <div id="fighterCard" class="career-card"></div>

    <div class="career-buttons">

        <button class="career-button">
            🥊 &nbsp; Следующий бой
        </button>

        <button class="career-button">
            🏋️ &nbsp; Тренировочный лагерь
        </button>

        <button class="career-button">
            📊 &nbsp; Характеристики
        </button>

        <button class="career-button">
            📋 &nbsp; История боёв
        </button>

    </div>

    <button
        class="back-button"
        onclick="showScreen('mainMenu')">
        ← В главное меню
    </button>

</section>


<script>
/* =========================
   РАБОТА С ЭКРАНАМИ
========================= */

function showScreen(screenId) {
    document.querySelectorAll('.screen').forEach(screen => {
        screen.classList.remove('active');
    });

    document.getElementById(screenId).classList.add('active');

    window.scrollTo({
        top: 0,
        behavior: 'instant'
    });
}


/* =========================
   СОХРАНЕНИЕ
========================= */

const SAVE_KEY = "mmaCareerSave";


function getSave() {
    const save = localStorage.getItem(SAVE_KEY);

    if (!save) {
        return null;
    }

    try {
        return JSON.parse(save);
    } catch (error) {
        console.error("Ошибка чтения сохранения:", error);
        return null;
    }
}


/* =========================
   КНОПКА ПРОДОЛЖИТЬ
========================= */

function updateContinueButton() {
    const button = document.getElementById("continueButton");
    const save = getSave();

    if (save) {
        button.disabled = false;
    } else {
        button.disabled = true;
    }
}


function continueGame() {
    const save = getSave();

    if (!save) {
        return;
    }

    openCareer(save);
}


/* =========================
   СОЗДАНИЕ БОЙЦА
========================= */

document.getElementById("fighterForm").addEventListener("submit", function(event) {

    event.preventDefault();

    const fighter = {
        name: document.getElementById("fighterName").value.trim(),
        age: Number(document.getElementById("fighterAge").value),
        country: document.getElementById("fighterCountry").value,
        style: document.getElementById("fighterStyle").value,
        weight: document.getElementById("fighterWeight").value,

        // Будем использовать позже
        record: {
            wins: 0,
            losses: 0,
            draws: 0
        },

        career: {
            popularity: 0,
            money: 0,
            rank: 0
        },

        createdAt: new Date().toISOString()
    };

    localStorage.setItem(
        SAVE_KEY,
        JSON.stringify(fighter)
    );

    openCareer(fighter);
});


/* =========================
   ОТКРЫТИЕ КАРЬЕРЫ
========================= */

function openCareer(fighter) {

    const weightNames = {
        light: "Лёгкий — до 70,3 кг",
        welter: "Полусредний — до 77,1 кг",
        middle: "Средний — до 83,9 кг",
        lightheavy: "Полутяжёлый — до 90,0 кг",
        heavy: "Тяжёлый — до 120,2 кг"
    };

    document.getElementById("fighterCard").innerHTML = `
        <div class="fighter-name">${escapeHTML(fighter.name)}</div>

        <div class="fighter-info">
            Возраст: ${fighter.age}<br>
            Страна: ${escapeHTML(fighter.country)}<br>
            Стиль: ${escapeHTML(fighter.style)}<br>
            Вес: ${weightNames[fighter.weight]}<br><br>

            Профессиональный рекорд:
            ${fighter.record.wins}-${fighter.record.losses}-${fighter.record.draws}
        </div>
    `;

    showScreen("careerMenu");
}


/* =========================
   ЗАЩИТА ОТ HTML
========================= */

function escapeHTML(text) {
    return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/* =========================
   ЗАПУСК
========================= */

updateContinueButton();

</script>

</body>
      </html>
